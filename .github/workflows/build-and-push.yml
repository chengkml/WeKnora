name: WeKnora 镜像构建、推送与部署

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY || 'crpi-u265r07n4blchcqo.cn-shanghai.personal.cr.aliyuncs.com' }}
  REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE || 'ck-registry' }}
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ===================================================================
  # App: native build per platform (parallel jobs, each has own timeout)
  # ===================================================================
  build-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 准备版本信息
        id: version
        run: |
          eval "$(./scripts/get_version.sh env)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "go_version=$GO_VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/get_version.sh info

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 App 镜像（${{ matrix.platform }}）
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.app
          context: .
          build-args: |
            VERSION_ARG=${{ steps.version.outputs.version }}
            COMMIT_ID_ARG=${{ steps.version.outputs.commit_id }}
            BUILD_TIME_ARG=${{ steps.version.outputs.build_time }}
            GO_VERSION_ARG=${{ steps.version.outputs.go_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:${{ github.sha }}-${{ matrix.arch_tag }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:${{ matrix.arch_tag }}
          cache-from: type=gha,scope=weknora-app-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=weknora-app-${{ matrix.arch_tag }}
          sbom: false
          provenance: false

  # ===================================================================
  # Docreader: 需要本地 protoc 安装，用原生 runner 各自构建
  # ===================================================================
  build-docreader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 Docreader 镜像（${{ matrix.platform }}）
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platform }}
          file: docker/Dockerfile.docreader
          context: .
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader:${{ github.sha }}-${{ matrix.arch_tag }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader:${{ matrix.arch_tag }}
          cache-from: type=gha,scope=weknora-docreader-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=weknora-docreader-${{ matrix.arch_tag }}
          sbom: false
          provenance: false

  # ===================================================================
  # UI: multi-platform build in one shot (nginx + static files, fast)
  # ===================================================================
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        env:
          VITE_IS_DOCKER: true
          VITE_FRONTEND_COMMIT: ${{ github.sha }}
        run: ./scripts/build_frontend_dist.sh

      - name: 设置 QEMU（跨平台仿真）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          driver-opts: |
            image=docker.m.daocloud.io/moby/buildkit:buildx-stable-1

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 UI 镜像
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          file: frontend/Dockerfile
          context: ./frontend
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-ui:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-ui:latest
          cache-from: type=gha,scope=weknora-ui
          cache-to: type=gha,mode=max,scope=weknora-ui
          sbom: false
          provenance: false

  # ===================================================================
  # MCP Gateway: Python 项目，多架构并行构建
  # ===================================================================
  build-mcp-gateway:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch_tag: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v6

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送 MCP Gateway 镜像（${{ matrix.platform }}）
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: ${{ matrix.platform }}
          file: mcp-gateway/Dockerfile
          context: ./mcp-gateway
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp-gateway:${{ github.sha }}-${{ matrix.arch_tag }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp-gateway:${{ matrix.arch_tag }}
          cache-from: type=gha,scope=weknora-mcp-gateway-${{ matrix.arch_tag }}
          cache-to: type=gha,mode=max,scope=weknora-mcp-gateway-${{ matrix.arch_tag }}
          sbom: false
          provenance: false

  # ===================================================================
  # Manifest: 合并多架构镜像到 latest 标签
  # ===================================================================
  merge-manifest:
    runs-on: ubuntu-latest
    needs: [build-app, build-docreader, build-ui, build-mcp-gateway]
    timeout-minutes: 10

    steps:
      - name: 登录阿里云镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 创建多架构 manifest（weknora-app:latest）
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:latest \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:amd64 \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-app:arm64

      - name: 创建多架构 manifest（weknora-docreader:latest）
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader:latest \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader:amd64 \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-docreader:arm64

      - name: 创建多架构 manifest（weknora-mcp-gateway:latest）
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp-gateway:latest \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp-gateway:amd64 \
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/weknora-mcp-gateway:arm64

  # ===================================================================
  # 部署到生产服务器（159.75.24.176）
  # ===================================================================
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    needs: [merge-manifest]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 校验部署参数
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${SERVER_HOST}" ] || { echo "::error::缺少 SERVER_HOST"; exit 1; }
          [ -n "${SERVER_USER}" ] || { echo "::error::缺少 SERVER_USER"; exit 1; }
          [ -n "${SERVER_SSH_KEY}" ] || { echo "::error::缺少 SERVER_SSH_KEY"; exit 1; }
          [ -n "${REGISTRY_USERNAME}" ] || { echo "::error::缺少 REGISTRY_USERNAME"; exit 1; }
          [ -n "${REGISTRY_PASSWORD}" ] || { echo "::error::缺少 REGISTRY_PASSWORD"; exit 1; }

      - name: 通过 SSH 拉取新镜像并更新容器
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_NAMESPACE: ${{ env.REGISTRY_NAMESPACE }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || vars.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || 22 }}
          timeout: 120s
          command_timeout: 45m
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE_TAG,REGISTRY,REGISTRY_NAMESPACE,REGISTRY_USERNAME,REGISTRY_PASSWORD
          script: |
            set -euo pipefail
            export DOCKER_CLIENT_TIMEOUT="${DOCKER_CLIENT_TIMEOUT:-600}"
            export COMPOSE_HTTP_TIMEOUT="${COMPOSE_HTTP_TIMEOUT:-600}"

            DEPLOY_DIR="${DEPLOY_PATH:-/opt/WeKnora}"
            echo "=== 部署到 ${DEPLOY_DIR} ==="

            cd "${DEPLOY_DIR}"

            # 登录镜像仓库
            echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY}" -u "${REGISTRY_USERNAME}" --password-stdin

            COMPOSE_CMD="docker compose"
            if ! docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            fi

            # 使用当前 commit SHA 作为完整镜像标签，latest 作为回退
            IMAGE_TAG="${IMAGE_TAG}"

            # 写入镜像标签文件（.env 会覆盖 compose 中的 image: 字段）
            # 保留现有 .env 中的数据配置不变
            {
              echo "APP_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/weknora-app:${IMAGE_TAG}"
              echo "DOCREADER_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/weknora-docreader:${IMAGE_TAG}"
              echo "UI_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/weknora-ui:${IMAGE_TAG}"
              echo "MCP_GATEWAY_IMAGE=${REGISTRY}/${REGISTRY_NAMESPACE}/weknora-mcp-gateway:${IMAGE_TAG}"
            } > .images.env

            # 确保数据目录存在（保留历史数据）
            mkdir -p \
              data/postgres \
              data/minio \
              data/files \
              data/docreader-tmp \
              config \
              skills

            pull_with_retry() {
              local max_retries=3
              local attempt=1
              while true; do
                if ${COMPOSE_CMD} -f docker-compose.yml --env-file .env --env-file .images.env pull; then
                  break
                fi
                if [ "${attempt}" -ge "${max_retries}" ]; then
                  echo "[error] docker compose pull failed after ${max_retries} attempts."
                  return 1
                fi
                local sleep_seconds=$((attempt * 20))
                echo "[warn] docker compose pull failed (attempt ${attempt}/${max_retries}), retrying in ${sleep_seconds}s..."
                sleep "${sleep_seconds}"
                attempt=$((attempt + 1))
              done
            }

            # 拉取新镜像
            pull_with_retry

            # 启动容器（保留数据卷，不删除旧容器）
            if ! ${COMPOSE_CMD} -f docker-compose.yml --env-file .env --env-file .images.env up -d --remove-orphans; then
              echo "[error] docker compose up failed, collecting container diagnostics..."
              ${COMPOSE_CMD} -f docker-compose.yml ps || true
              ${COMPOSE_CMD} -f docker-compose.yml logs --no-color --tail 200 app || true
              ${COMPOSE_CMD} -f docker-compose.yml logs --no-color --tail 100 frontend || true
              ${COMPOSE_CMD} -f docker-compose.yml logs --no-color --tail 100 docreader || true
              exit 1
            fi

            echo "=== 部署完成 ==="
            ${COMPOSE_CMD} -f docker-compose.yml ps